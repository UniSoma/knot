name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BB_VERSION: 1.13.222

jobs:
  test:
    name: bb test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          bb: ${{ env.BB_VERSION }}

      - name: Run tests
        run: bb test
